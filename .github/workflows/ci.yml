name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workbench
      - run: npm test
      - run: npm run demo
      - run: npm run workbench:build
      - run: npm run research:demo
      - run: npm run verify-report -- .jev-runs/research-demo.json
      - run: npm run replay -- .jev-runs/research-demo.json
      - run: npm pack --dry-run
