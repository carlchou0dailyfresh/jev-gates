name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix workbench
      - run: npm test
      - run: npm run demo
      - run: npm run research:demo
      - run: npm run research:eval
      - run: npm run studio:build
      - run: npm run delivery:demo
      - run: npm run delivery:verify
      - run: npm run studio:demo
      - run: npm run studio:verify-report -- .jev-runs/studio/research-demo.json
      - run: npm run studio:replay -- .jev-runs/studio/research-demo.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: npm --prefix ui exec -- playwright install --with-deps chromium
        if: matrix.node == 24
      - run: npm --prefix ui run test:browser
        if: matrix.node == 24
      - run: npm pack --dry-run
